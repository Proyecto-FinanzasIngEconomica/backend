spring.application.name=CrediFlow

#Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/store_credit_management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=com.crediflow.store_credit_management.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
# JPA - Lazy loading fuera de transacción (evita LazyInitializationException en ciertos escenarios de desarrollo)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# OpenAPI Documentation
documentation.application.description=Store Credit Management Platform API
documentation.application.version=1.0.0

# OpenAPI/Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.enabled=true