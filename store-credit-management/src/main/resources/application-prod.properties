server.port=${PORT:8080}
# Detrás del proxy de Render: toma la IP real del cliente (auditoría) y el esquema https.
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# TEMPORAL hasta tener migraciones con Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Sin Swagger en producción salvo que se active
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
crediflow.security.swagger-public=${SWAGGER_ENABLED:false}

crediflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
crediflow.statements.scheduler-enabled=${STATEMENTS_SCHEDULER_ENABLED:false}