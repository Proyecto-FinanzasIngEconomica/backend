spring.application.name=CrediFlow

#Database Configuration
# Base de datos: en local usa estos valores; en producción llegan por variables de entorno.
# Tu contraseña local va en .env.properties (ignorado por Git), no aquí.
spring.config.import=optional:file:./.env.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/store_credit_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Salud (solo el estado, sin detalles)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=com.crediflow.store_credit_management.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
# JPA - Lazy loading fuera de transacción (evita LazyInitializationException en ciertos escenarios de desarrollo)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# OpenAPI Documentation
documentation.application.description=Store Credit Management Platform API
documentation.application.version=1.0.0

# OpenAPI/Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.enabled=true

# Estados de cuenta: tarea programada (desactivada por defecto; activar en producción)
crediflow.statements.scheduler-enabled=false
crediflow.statements.scheduler-interval-ms=3600000
crediflow.statements.scheduler-initial-delay-ms=60000

# Perfil por defecto: dev. En producción se activa otro (SPRING_PROFILES_ACTIVE=prod) y este deja de aplicar.
spring.profiles.default=dev

# Seguridad: la clave del JWT y el primer administrador salen del entorno, nunca del repositorio.
crediflow.security.jwt-secret=${CREDIFLOW_JWT_SECRET:}
crediflow.security.jwt-expiration-hours=8
crediflow.bootstrap.admin-username=${CREDIFLOW_ADMIN_USERNAME:}
crediflow.bootstrap.admin-password=${CREDIFLOW_ADMIN_PASSWORD:}

# CORS: orígenes del frontend permitidos, separados por coma.
crediflow.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200